services:
  migration:
    build:
      context: ./server
      dockerfile: Dockerfile.migration
    restart: "no"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/production.db
    volumes:
      - sqlite_data:/app/data

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=file:/app/data/production.db
      - JWT_SECRET=change-this-to-a-secure-32-character-secret-in-prod!
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://127.0.0.1
    volumes:
      - sqlite_data:/app/data
    depends_on:
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5000/api/health/live').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  reverse-proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-security.conf:/etc/nginx/nginx-security.conf:ro
      - ./client/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  sqlite_data:
