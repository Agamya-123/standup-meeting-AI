events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance optimizations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Upstream Backend API Service
    upstream backend_api {
        server backend:5000;
        keepalive 32;
    }

    # HTTP Server (Redirects to HTTPS in production, or serves fallback)
    server {
        listen 80;
        server_name localhost;

        # Root directory for compiled SPA frontend
        root /usr/share/nginx/html;
        index index.html;

        # Reusable frontend production security headers
        include /etc/nginx/nginx-security.conf;

        # Long-lived caching for immutable hashed assets
        location ~* ^/assets/.*\.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            include /etc/nginx/nginx-security.conf;
            access_log off;
        }

        # Reverse Proxy for API Routes
        location /api/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Proxy Timeouts aligned with backend (60s)
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffer limits
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # Single Page Application (SPA) Routing Fallback
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            include /etc/nginx/nginx-security.conf;
        }
    }

    # Optional Production HTTPS Server (Uncomment when SSL certificates are mounted in /etc/nginx/certs/)
    # server {
